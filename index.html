<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Financeira Pessoal | Monitoramento, Controle e Previsão</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-slate-950 flex flex-col">
  <!-- Root Container -->
  <div id="app" class="flex-1 flex flex-col">
    <div class="flex items-center justify-center min-h-[60vh]">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm text-slate-400 font-medium">Carregando Central Financeira Pessoal...</p>
      </div>
    </div>
  </div>

  <!-- Main JavaScript Bootstrap -->
  <script type="module">
    import { CentralFinanceiraApp } from "./src/ui/app.js";

    document.addEventListener("DOMContentLoaded", () => {
      const appEl = document.getElementById("app");
      window.centralFinanceira = new CentralFinanceiraApp(appEl);
    });
  </script>
</body>
</html>
